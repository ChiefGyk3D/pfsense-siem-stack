# Dependabot's own pull requests, merged once the gate is green. The job
# lives in ChiefGyk3D/git-your-ship-together; a major bump is still left for a person.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: read

jobs:
  auto-merge:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/dependabot-auto-merge.yml@cc7fa6f48a612183ecd900ed15810da61b30288a # v1.17.0
    permissions:
      contents: write  # enable auto-merge on the pull request
      pull-requests: write  # read its Dependabot metadata

name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax check (bash -n)
        run: |
          set -e
          fail=0
          while IFS= read -r -d '' f; do
            if ! bash -n "$f"; then
              echo "Syntax error: $f"
              fail=1
            fi
          done < <(git ls-files -z '*.sh')
          if ! bash -n pfsense-siem; then
            echo "Syntax error: pfsense-siem"
            fail=1
          fi
          exit "$fail"

      - name: JSON validation (dashboards and config)
        run: |
          set -e
          fail=0
          while IFS= read -r -d '' f; do
            if ! python3 -m json.tool "$f" > /dev/null; then
              echo "Invalid JSON: $f"
              fail=1
            fi
          done < <(git ls-files -z 'dashboards/*.json' 'dashboards/**/*.json' 'config/*.json')
          exit "$fail"

      - name: Python syntax check (py_compile)
        run: |
          set -e
          fail=0
          while IFS= read -r -d '' f; do
            case "$f" in
              plugins/Old/*) continue ;;  # legacy Python 2 plugins, kept for reference
            esac
            if ! python3 -m py_compile "$f"; then
              echo "Syntax error: $f"
              fail=1
            fi
          done < <(git ls-files -z '*.py')
          exit "$fail"

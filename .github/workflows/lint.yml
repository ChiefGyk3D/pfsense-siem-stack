name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax check (bash -n)
        run: |
          set -e
          fail=0
          while IFS= read -r -d '' f; do
            if ! bash -n "$f"; then
              echo "Syntax error: $f"
              fail=1
            fi
          done < <(git ls-files -z '*.sh')
          if ! bash -n pfsense-siem; then
            echo "Syntax error: pfsense-siem"
            fail=1
          fi
          exit "$fail"

      - name: ShellCheck (error severity)
        run: |
          set -e
          # shellcheck is preinstalled on ubuntu-latest runners
          mapfile -t files < <(git ls-files '*.sh')
          files+=(pfsense-siem)
          shellcheck --severity=error "${files[@]}"

      - name: JSON validation (dashboards and config)
        run: |
          set -e
          fail=0
          while IFS= read -r -d '' f; do
            if ! python3 -m json.tool "$f" > /dev/null; then
              echo "Invalid JSON: $f"
              fail=1
            fi
          done < <(git ls-files -z 'dashboards/*.json' 'dashboards/**/*.json' 'config/*.json')
          exit "$fail"

      - name: Python syntax check (py_compile)
        run: |
          set -e
          fail=0
          while IFS= read -r -d '' f; do
            if ! python3 -m py_compile "$f"; then
              echo "Syntax error: $f"
              fail=1
            fi
          done < <(git ls-files -z '*.py')
          exit "$fail"

      - name: Documentation link check
        run: python3 scripts/check-doc-links.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pytest
        run: python3 -m pip install --user pytest

      # maxminddb is deliberately NOT installed: the forwarder degrades
      # gracefully without it and the tests stub the GeoIP reader, so CI
      # needs no GeoIP database.
      - name: Run forwarder unit tests
        run: python3 -m pytest tests/python/ -v

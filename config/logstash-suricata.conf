# Logstash Pipeline for Suricata EVE JSON Logs
#
# Purpose: Receives Suricata eve.json events via UDP from pfSense forwarder,
#          parses JSON (flat structure), and indexes to OpenSearch
#
# Data Flow:
#   pfSense (Suricata) → Forwarder (UDP) → Logstash (this pipeline) → OpenSearch
#
# Deployed to: /etc/logstash/conf.d/suricata.conf
# Restart after changes: sudo systemctl restart logstash

# ========================================================================
# INPUT: UDP Listener
# ========================================================================
# SECURITY: this input has no authentication or integrity. Anything that can reach the port
# controls the event fields (event_type, src_ip, alert.*, @timestamp). install.sh opens
# UDP 5140 only to LOGSTASH_ALLOWED_SOURCES (the pfSense address). Keep it that way.
input {
  udp {
    port => 5140                      # Listen on UDP 5140 (forwarder sends here)
    codec => plain                    # Receive raw text (JSON strings)
    buffer_size => 65536              # 64KB buffer per datagram (UDP limit)
    receive_buffer_bytes => 33554432  # 32MB OS-level buffer (handles bursts)
  }
}

# ========================================================================
# FILTER: Parse, validate, then copy an allow-listed set of fields to the root
# ========================================================================
# SECURITY (threat t_spoof): the sender is untrusted. The JSON is parsed into
# [@metadata][eve] (never indexed, never the event root), validated, and only
# allow-listed Suricata keys are copied to the root, where the dashboards read
# them (event_type, src_ip, alert.*, in_iface, geoip_*, ...). Pipeline-owned
# fields (@timestamp, @version, tags, host, message, event, ...) cannot be set
# by the sender. Events that fail validation are NOT indexed to suricata-*; they
# go to eve-quarantine-* with a reason and the raw text truncated to 2 KB.
# This does not authenticate the sender: a host that can reach the port can still
# send well-formed fake events. Use a network control (see docs).
filter {
  if [event][original] {
    json {
      source => "[event][original]"
      target => "[@metadata][eve]"
      tag_on_failure => ["_jsonparsefailure"]
    }
  } else if [message] {
    json {
      source => "message"
      target => "[@metadata][eve]"
      tag_on_failure => ["_jsonparsefailure"]
    }
  }

  # Step 1: validate and copy. Sets [@metadata][quarantine_reason] on failure.
  ruby {
    init => 'require "ipaddr"'
    code => '
      allowed = %w[timestamp flow_id in_iface event_type vlan src_ip src_port dest_ip dest_port proto app_proto app_proto_ts app_proto_tc app_proto_orig community_id tx_id pcap_cnt pkt_src icmp_type icmp_code ip_v alert http dns tls flow fileinfo ssh smb dhcp ftp krb5 mqtt nfs rdp rfb sip snmp tftp quic ikev2 dcerpc anomaly stats netflow metadata geoip_src geoip_dest]
      eve = event.get("[@metadata][eve]")
      reason = nil
      isint = lambda do |v, lo, hi|
        v.is_a?(Integer) && v >= lo && v <= hi
      end
      isstr = lambda do |v, max, re|
        v.is_a?(String) && v.length <= max && (re.nil? || v =~ re)
      end
      isip = lambda do |v|
        ok = false
        if v.is_a?(String) && v.length <= 45 && v !~ /[\/%\s]/
          begin
            IPAddr.new(v)
            ok = true
          rescue StandardError
            ok = false
          end
        end
        ok
      end
      if event.get("tags").is_a?(Array) && event.get("tags").include?("_jsonparsefailure")
        reason = "json_parse_failure"
      elsif !eve.is_a?(Hash)
        reason = "not_json_object"
      else
        reason = "bad_event_type" unless isstr.call(eve["event_type"], 32, /\A[a-z0-9_]+\z/)
        reason ||= "bad_src_ip" if eve.key?("src_ip") && !isip.call(eve["src_ip"])
        reason ||= "bad_dest_ip" if eve.key?("dest_ip") && !isip.call(eve["dest_ip"])
        reason ||= "bad_src_port" if eve.key?("src_port") && !isint.call(eve["src_port"], 0, 65535)
        reason ||= "bad_dest_port" if eve.key?("dest_port") && !isint.call(eve["dest_port"], 0, 65535)
        reason ||= "bad_proto" if eve.key?("proto") && !isstr.call(eve["proto"], 32, /\A[A-Za-z0-9_\-]+\z/)
        reason ||= "bad_app_proto" if eve.key?("app_proto") && !isstr.call(eve["app_proto"], 32, /\A[A-Za-z0-9_\-]+\z/)
        reason ||= "bad_in_iface" if eve.key?("in_iface") && !isstr.call(eve["in_iface"], 64, /\A[A-Za-z0-9_.\-]+\z/)
        reason ||= "bad_flow_id" if eve.key?("flow_id") && !isint.call(eve["flow_id"], 0, 18446744073709551615)
        reason ||= "bad_timestamp" if eve.key?("timestamp") && !isstr.call(eve["timestamp"], 40, /\A\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(\.\d{1,9})?(Z|[+-]\d\d:?\d\d)\z/)
        if reason.nil? && eve.key?("alert")
          al = eve["alert"]
          if !al.is_a?(Hash)
            reason = "bad_alert"
          else
            reason = "bad_alert_severity" if al.key?("severity") && !isint.call(al["severity"], 0, 255)
            reason ||= "bad_alert_action" if al.key?("action") && !%w[allowed blocked].include?(al["action"])
            reason ||= "bad_alert_signature_id" if al.key?("signature_id") && !isint.call(al["signature_id"], 0, 4294967295)
            reason ||= "bad_alert_rev" if al.key?("rev") && !isint.call(al["rev"], 0, 4294967295)
            reason ||= "bad_alert_gid" if al.key?("gid") && !isint.call(al["gid"], 0, 4294967295)
            reason ||= "bad_alert_signature" if al.key?("signature") && !isstr.call(al["signature"], 1024, nil)
            reason ||= "bad_alert_category" if al.key?("category") && !isstr.call(al["category"], 256, nil)
          end
        end
        if reason.nil? && eve.key?("flow")
          fl = eve["flow"]
          if !fl.is_a?(Hash)
            reason = "bad_flow"
          else
            %w[pkts_toserver pkts_toclient bytes_toserver bytes_toclient].each do |k|
              reason ||= "bad_flow_counter" if fl.key?(k) && !isint.call(fl[k], 0, 9223372036854775807)
            end
          end
        end
        if reason.nil? && eve.key?("http")
          ht = eve["http"]
          if !ht.is_a?(Hash)
            reason = "bad_http"
          else
            reason = "bad_http_status" if ht.key?("status") && !isint.call(ht["status"], 0, 999)
            reason ||= "bad_http_length" if ht.key?("length") && !isint.call(ht["length"], 0, 9223372036854775807)
          end
        end
        %w[dns tls fileinfo ssh].each do |k|
          reason ||= "bad_" + k if eve.key?(k) && !eve[k].is_a?(Hash)
        end
        %w[geoip_src geoip_dest].each do |k|
          if reason.nil? && eve.key?(k)
            g = eve[k]
            loc = g.is_a?(Hash) ? g["location"] : nil
            if !g.is_a?(Hash)
              reason = "bad_" + k
            elsif !loc.nil? && !(loc.is_a?(Array) && loc.length == 2 && loc.all? { |n| n.is_a?(Numeric) } && loc[0].abs <= 180 && loc[1].abs <= 90)
              reason = "bad_" + k + "_location"
            end
          end
        end
        # generic bounds on every allow-listed value: depth, width, key names, string size
        if reason.nil?
          stack = []
          allowed.each { |k| stack.push([eve[k], 1]) if eve.key?(k) }
          until stack.empty? || !reason.nil?
            val, depth = stack.pop
            if depth > 8
              reason = "too_deep"
            elsif val.is_a?(Hash)
              reason = "too_wide" if val.length > 256
              val.each do |hk, hv|
                reason ||= "bad_key" unless hk.is_a?(String) && hk =~ /\A[A-Za-z0-9_\-]{1,64}\z/
                stack.push([hv, depth + 1])
              end
            elsif val.is_a?(Array)
              reason = "too_wide" if val.length > 256
              val.each { |av| stack.push([av, depth + 1]) }
            elsif val.is_a?(String)
              reason = "string_too_long" if val.length > 4096
            end
          end
        end
      end
      if reason.nil?
        allowed.each { |k| event.set(k, eve[k]) if eve.key?(k) }
      else
        event.set("[@metadata][quarantine_reason]", reason)
      end
    '
  }

  # Step 2: take @timestamp from the (validated) Suricata timestamp.
  if [timestamp] and !([@metadata][quarantine_reason]) {
    date {
      match => [ "timestamp", "ISO8601" ]
      target => "@timestamp"
      tag_on_failure => ["_dateparsefailure"]
    }
  }

  # Step 3: a forged or unparseable time must not pick the daily index.
  # Accept from 7 days ago to 1 hour ahead of the receive time.
  ruby {
    code => '
      if event.get("[@metadata][quarantine_reason]").nil?
        tags = event.get("tags")
        if tags.is_a?(Array) && tags.include?("_dateparsefailure")
          event.set("[@metadata][quarantine_reason]", "bad_timestamp")
        else
          t = event.get("@timestamp").time
          now = Time.now
          if t < now - 604800 || t > now + 3600
            event.set("[@metadata][quarantine_reason]", "timestamp_out_of_range")
          end
        end
      end
    '
  }

  # Step 4: quarantined events keep only the reason and the raw text (2 KB).
  # Accepted events drop the raw message and the parsed copy.
  if [@metadata][quarantine_reason] {
    ruby {
      code => '
        msg = event.get("message").to_s[0, 2048]
        event.to_hash.keys.each do |k|
          event.remove(k) unless %w[@timestamp @version host].include?(k)
        end
        event.set("message", msg)
        event.set("eve_quarantine_reason", event.get("[@metadata][quarantine_reason]"))
        event.set("tags", ["_eve_quarantine"])
      '
    }
  } else {
    mutate {
      remove_field => ["message", "[event][original]"]
    }
  }

  # Step 5: index date, taken from the validated @timestamp.
  mutate {
    add_field => { "[@metadata][index_date]" => "%{+YYYY.MM.dd}" }
  }
}

# ========================================================================
# OUTPUT: Send to OpenSearch
# ========================================================================
output {
  if [@metadata][quarantine_reason] {
    # Rejected input. Not matched by suricata-*, so dashboards never read it.
    opensearch {
      hosts => ["http://localhost:9200"]
      index => "eve-quarantine-%{[@metadata][index_date]}"
      ssl => false
      ssl_certificate_verification => false
    }
  } else {
    opensearch {
      hosts => ["http://localhost:9200"]           # OpenSearch endpoint
      index => "suricata-%{[@metadata][index_date]}" # Daily indices: suricata-2025.11.27
      ssl => false                                  # No SSL for localhost (use true for remote)
      ssl_certificate_verification => false         # Disable cert check (for self-signed certs)

      # Optional: Add authentication if OpenSearch has security enabled
      # user => "admin"
      # password => "<opensearch-password>"

      # Optional: Batch settings for performance
      # flush_size => 500           # Bulk size (events per batch)
      # idle_flush_time => 1        # Flush interval (seconds)
    }
  }

  # Optional: Debug output (uncomment to log events to console)
  # stdout {
  #   codec => rubydebug
  # }
}

# ========================================================================
# CONFIGURATION NOTES
# ========================================================================
#
# 1. Flat Structure (RECOMMENDED):
#    All Suricata fields are at root level (e.g., event_type, src_ip, dest_ip).
#    This matches the Grafana dashboard queries. Do NOT nest under suricata.eve.*.
#    Old nested structure is deprecated - see docs/troubleshooting/DASHBOARD_NO_DATA_FIX.md.
#
# 2. GeoIP Enrichment:
#    GeoIP is added by the forwarder BEFORE sending to Logstash. No GeoIP
#    filter needed here. Look for geoip_src.location and geoip_dest.location fields.
#
# 3. Index Template:
#    OpenSearch must have proper index template for suricata-* indices.
#    Run: ./scripts/install-opensearch-config.sh to create template.
#    Template defines field mappings (geo_point, keyword, nested, etc.)
#
# 4. Performance Tuning:
#    - Increase receive_buffer_bytes if dropping UDP packets (check dmesg)
#    - Increase Logstash heap: /etc/logstash/jvm.options (-Xms2g -Xmx2g)
#    - Monitor pipeline with: curl localhost:9600/_node/stats/pipelines
#
# 5. Testing:
#    Send test event:
#      echo '{"timestamp":"2025-11-27T12:00:00.000000-0500","event_type":"test","src_ip":"1.2.3.4"}' | nc -u localhost 5140
#    Check in OpenSearch:
#      curl -s localhost:9200/suricata-*/_search?q=event_type:test | jq
